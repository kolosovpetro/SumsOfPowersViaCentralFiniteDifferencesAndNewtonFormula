name: Docker Build Push API

on:
  push:
    branches:
      - main
      - MATH-141

  pull_request:
    branches:
      - main

  workflow_dispatch:

#  schedule:
#    - cron: '0 0 * * 0'

jobs:
  mathematica:
    name: Mathematica
    runs-on: ubuntu-latest
    
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull Wolfram image
        run: docker pull wolframresearch/wolframengine:15.0

      - name: Copy License File
        shell: bash
        run: |
          mkdir -p "./mathematica/Licensing"
          cd "./mathematica/Licensing"
          echo "$WOLFRAM_LICENSE_FILE" > mathpass
        env:
          WOLFRAM_LICENSE_FILE: ${{ secrets.WOLFRAM_LICENSE_FILE }}

      - name: Run WolframScript in Docker
        shell: bash
        run: |
          cd "./mathematica"
          chmod +x Run-Wolfram-Container.sh
          ./Run-Wolfram-Container.sh